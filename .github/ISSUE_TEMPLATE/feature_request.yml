name: Feature request
description: Suggest a focused improvement for FrigateSpotter
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve for users?
      placeholder: Describe the real-world use case before proposing implementation details.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should FrigateSpotter do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing Frigate, Home Assistant, MQTT, ONVIF, or vendor features that might already address part of the need.

  - type: textarea
    id: examples
    attributes:
      label: Example configuration or UI
      description: Optional mock-up, mapping example, or expected workflow.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request is focused on FrigateSpotter's PTZ routing/automation scope.
          required: true
