name: Bug report
description: Report a reproducible problem in FrigateSpotter
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove passwords, tokens, private URLs, public-facing IP addresses, and other secrets before submitting.

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect to happen?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction you can.
      placeholder: |
        1. Configure ...
        2. Trigger ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FrigateSpotter version or commit
      placeholder: v0.x.y or commit SHA
    validations:
      required: true

  - type: input
    id: frigate
    attributes:
      label: Frigate version
      placeholder: e.g. 0.x.y

  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.x.y, if applicable

  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Camera model, PTZ protocol, MQTT broker, deployment type, browser, or other details that matter to this bug.

  - type: textarea
    id: logs
    attributes:
      label: Logs or configuration excerpts
      description: Sanitize all secrets and private data first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials and private/sensitive information from this report.
          required: true
